<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteStudio MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <aside id="elements-panel">
      <h3>Elements</h3>
      <button id="export-html">Export HTML</button>
      <hr />

      <button id="add-header">Add Header</button>
      <button id="add-text">Add Text</button>
      <button id="add-section">Add Section</button>
    </aside>

    <main id="canvas"></main>

    <aside id="properties-panel">
  <h3>Properties</h3>

  <div id="no-selection">Select an element</div>

  <div id="properties" style="display:none;">
    <label>
      Text
      <input type="text" id="prop-text" />
    </label>

    <label>
      Font Size (px)
      <input type="number" id="prop-font-size" />
    </label>

    <label>
      Text Color
      <input type="color" id="prop-color" />
    </label>

    <label>
      Padding (px)
      <input type="number" id="prop-padding" />
    </label>
    <label>
  Width (%)
  <input type="number" id="prop-width" min="1" max="100" />
</label>

<label>
  Align
  <select id="prop-align">
    <option value="">Default</option>
    <option value="left">Left</option>
    <option value="center">Center</option>
    <option value="right">Right</option>
  </select>
</label>

<label>
  Background
  <input type="color" id="prop-bg" />
</label>

  </div>
</aside>

  </div>

  <script src="script.js"></script>
</body>
</html>
